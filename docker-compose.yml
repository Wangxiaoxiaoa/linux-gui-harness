services:
  linux-gui-harness:
    build: .
    container_name: linux-gui-harness
    # Run the long-lived daemon; agents exec in with `linux-gui-harness mcp`.
    command: ["serve"]
    environment:
      - DISPLAY=:99
    # Share host IPC for better X11/Shm performance (optional).
    ipc: host
    # No ports exposed; MCP uses stdio via docker exec.
