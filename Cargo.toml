[workspace]
members = ["lgh/*"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wangxiaoxiaoa/linux-gui-harness"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-std", "net", "io-util", "fs", "signal"] }
thiserror = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
x11rb = { version = "0.13", features = ["xtest", "res"] }
x11-keysymdef = "0.2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
atspi = { version = "0.30", features = ["tokio"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
schemars = "0.8"

lgh-core = { path = "lgh/core" }
lgh-action = { path = "lgh/action" }
lgh-state = { path = "lgh/state" }
lgh-driver = { path = "lgh/driver" }
lgh-runtime = { path = "lgh/runtime" }
lgh-preview = { path = "lgh/preview" }
lgh-daemon = { path = "lgh/daemon" }
