[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linux-gui-harness"
version = "0.1.3"
description = "Linux X11 GUI harness with MCP server and native automation driver"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "linux-gui-harness contributors" },
]
keywords = [
    "mcp",
    "gui",
    "automation",
    "x11",
    "harness",
    "accessibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Wangxiaoxiaoa/linux-gui-harness"
Repository = "https://github.com/Wangxiaoxiaoa/linux-gui-harness"
Issues = "https://github.com/Wangxiaoxiaoa/linux-gui-harness/issues"

[project.scripts]
linux-gui-harness = "linux_gui_harness.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["python/src/linux_gui_harness"]
artifacts = [
    "python/src/linux_gui_harness/bin/*",
    "python/src/linux_gui_harness/skill/*",
    "python/src/linux_gui_harness/lifecycle/*",
]
pure-python = false

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
